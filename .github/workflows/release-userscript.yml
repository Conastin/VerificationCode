# 打包用户脚本（含模型）并发布 GitHub Release
#
# 触发方式：
#   1. 手动：仓库 Actions 页 → "Release Userscript" → Run workflow
#   2. 自动：推送 v* 标签（如 git tag v3.1.0 && git push origin v3.1.0）
#
# 分发主渠道是 jsDelivr CDN（@<tag> 路径）与脚本猫脚本市场；
# Release zip 是离线备份（脚本 + 模型，导入管理器或手动放置缓存）。

name: Release Userscript

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史+全部 tag: release notes 需要 git log <prev_tag>..HEAD
          fetch-depth: 0

      - name: Read version from userscript
        id: version
        run: |
          echo "version=$(grep -oP '(?<=@version)\s+\S+' userscript/captcha-autofill.user.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Validate JS syntax
        run: node --check userscript/captcha-autofill.user.js

      - name: Package userscript
        run: |
          mkdir -p package/userscript
          cp userscript/captcha-autofill.user.js package/userscript/
          cp userscript/model.onnx package/userscript/
          cp README.md package/
          cd package
          zip -r "../captcha-autofill-userscript-v${{ steps.version.outputs.version }}.zip" .

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --format='%h %s' "$PREV_TAG"..HEAD)
          else
            LOG=$(git log --format='%h %s' -15)
          fi
          # 按 Conventional Commits 前缀分组（空组不输出）
          NOTES="更新内容"
          declare -A GROUPS=(
            ["feat"]="### 🚀 新功能" ["fix"]="### 🐛 修复" ["perf"]="### ⚡ 性能"
            ["refactor"]="### ♻️ 重构" ["test"]="### 🧪 测试" ["docs"]="### 📝 文档"
          )
          ORDER=("feat" "fix" "perf" "refactor" "test" "docs" "ci" "chore" "其他")
          for key in "${ORDER[@]}"; do
            if [ "$key" = "其他" ]; then
              LINES=$(echo "$LOG" | grep -vE "^\S+ (feat|fix|perf|refactor|test|docs|ci|chore)(\(|:)" || true)
              HEADER="### 🔧 构建/维护"
            else
              LINES=$(echo "$LOG" | grep -E "^\S+ $key(\(|:)" || true)
              HEADER="${GROUPS[$key]}"
            fi
            if [ -n "$LINES" ]; then
              NOTES="$NOTES

$HEADER
$LINES"
            fi
          done
          NOTES="$NOTES

## 安装说明

1. 下载本 Release 资产 captcha-autofill-userscript-v${{ steps.version.outputs.version }}.zip
2. 方式一（推荐）：脚本猫/Tampermonkey → 新建脚本 → 粘贴 userscript/captcha-autofill.user.js 内容
3. 方式二：解压 zip，把 model.onnx 放入管理器脚本资源后导入脚本

> 模型也可由脚本自动从 jsDelivr CDN 下载（首次约 10MB，之后本地缓存）。"
          # 多行字符串写入 GITHUB_OUTPUT（去除 10 空格基缩进）
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES" | sed 's/^ \{10\}//'
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            "captcha-autofill-userscript-v${VERSION}.zip" \
            --title "验证码自动识别填充（用户脚本） v${VERSION}" \
            --notes "${{ steps.notes.outputs.notes }}"

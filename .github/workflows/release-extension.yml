# 打包浏览器扩展并发布 GitHub Release
#
# 触发方式：
#   1. 手动：仓库 Actions 页 → "Release Extension" → Run workflow
#   2. 自动：推送 v* 标签（如 git tag v2.3.0 && git push --tags）
#
# Release 版本号取自 browser/extension/manifest.json 的 version 字段，
# 打成的 zip 可直接在 chrome://extensions 加载（或分发安装）。

name: Release Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          echo "version=$(python3 -c "import json;print(json.load(open('browser/extension/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and JS syntax
        run: |
          node --check browser/extension/content.js
          node --check browser/extension/background.js
          node --check browser/extension/popup.js
          node --check browser/extension/shared/recognizer.js
          python3 -c "import json; json.load(open('browser/extension/manifest.json')); print('manifest OK')"

      - name: Package extension
        run: |
          cd browser/extension
          zip -r "../../verification-code-extension-v${{ steps.version.outputs.version }}.zip" .

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ZIP="verification-code-extension-v${{ steps.version.outputs.version }}.zip"
          gh release create "$TAG" "$ZIP" \
            --generate-notes \
            --title "验证码自动识别填充 $TAG" \
            --notes "浏览器扩展打包：加载已解压的扩展程序选择 browser/extension，或解压本 zip 后加载。" || {
            echo "::error::Release $TAG 已存在（或创建失败），请先更新 manifest.json 版本号"
            exit 1
          }

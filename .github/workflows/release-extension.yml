# 打包浏览器扩展并发布 GitHub Release
#
# 触发方式：
#   1. 手动：仓库 Actions 页 → "Release Extension" → Run workflow
#   2. 自动：推送 v* 标签（如 git tag v2.3.0 && git push --tags）
#
# Release 版本号取自 browser/extension/manifest.json 的 version 字段，
# 打成的 zip 可直接在 chrome://extensions 加载（或分发安装）。

name: Release Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from manifest
        id: version
        run: |
          echo "version=$(python3 -c "import json;print(json.load(open('browser/extension/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and JS syntax
        run: |
          node --check browser/extension/content.js
          node --check browser/extension/background.js
          node --check browser/extension/popup.js
          node --check browser/extension/shared/recognizer.js
          python3 -c "import json; json.load(open('browser/extension/manifest.json')); print('manifest OK')"

      - name: Package extension
        run: |
          cd browser/extension
          zip -r "../../verification-code-extension-v${{ steps.version.outputs.version }}.zip" .

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "$PREV_TAG"..HEAD)
          else
            LOG=$(git log --oneline -15)
          fi
          NOTES=$(cat <<NOTES_BODY
          ## 安装说明

          1. 下载本 Release 资产 `verification-code-extension-v${{ steps.version.outputs.version }}.zip`
          2. 解压到任意目录
          3. `chrome://extensions` → 开发者模式 → 加载已解压的扩展程序 → 选择解压目录

          ## 更新内容

          ```text
          $LOG
          ```
          NOTES_BODY
          )
          # 去掉 YAML 缩进（10 空格），保持 Markdown 干净
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^ \{10\}//')
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ZIP="verification-code-extension-v${{ steps.version.outputs.version }}.zip"
          gh release create "$TAG" "$ZIP" \
            --title "验证码自动识别填充 $TAG" \
            --notes "${{ steps.notes.outputs.notes }}" || {
            echo "::error::Release $TAG 已存在（或创建失败），请先更新 manifest.json 版本号"
            exit 1
          }

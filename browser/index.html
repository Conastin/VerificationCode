<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CAPTCHA 识别器 · 浏览器端验证</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  .status { padding: 8px 12px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
  .status.loading { background: #fff7e6; color: #8a6100; }
  .status.ok { background: #f0f9eb; color: #2f6b0f; }
  .status.err { background: #fef0f0; color: #a11; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 16px 0; }
  .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; }
  .card img { width: 100%; image-rendering: pixelated; border: 1px solid #ddd; border-radius: 4px; }
  .card .label { font-size: 13px; margin-top: 6px; }
  .card .js { font-weight: bold; }
  .ok-text { color: #2f6b0f; }
  .bad-text { color: #c00; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
  th { background: #f5f5f5; }
  .btn { padding: 8px 18px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; }
  .btn-primary { background: #2f6b0f; color: #fff; }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
  .section { margin-top: 28px; }
  .hint { font-size: 13px; color: #777; margin-top: 8px; }
  #fileBox { border: 2px dashed #ccc; padding: 18px; text-align: center; border-radius: 8px; margin-top: 12px; }
  #customResult { margin-top: 12px; font-size: 15px; }
</style>
</head>
<body>
<h1>CAPTCHA 识别器 · 浏览器端验证（onnxruntime-web）</h1>
<div id="status" class="status loading">正在加载模型…</div>

<div class="section">
  <button id="runBtn" class="btn btn-primary" disabled>识别全部示例</button>
  <button id="pickBtn" class="btn" disabled>识别自定义图片</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <span class="hint">示例图来自独立测试集；结果与 Python 端基准对比</span>
</div>

<div class="grid" id="grid"></div>

<div class="section">
  <h3>结果对比</h3>
  <table id="resultTable">
    <thead><tr><th>图片</th><th>真实标签</th><th>浏览器(JS)预测</th><th>Python 基准</th><th>JS 最低置信度</th><th>一致性</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="section">
  <h3>自定义图片</h3>
  <div id="fileBox">点击上方"识别自定义图片"选择本地验证码图片（60×20 JPEG）</div>
  <div id="customResult"></div>
</div>

<script src="vendor/onnxruntime-web/ort.wasm.min.js"></script>
<script src="shared/recognizer.js"></script>
<script src="recognize.js"></script>
</body>
</html>

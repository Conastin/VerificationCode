<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>验证码失败样本</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px 16px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #222;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    #count {
      margin-bottom: 12px;
      color: #555;
    }
    button {
      width: 100%;
      padding: 8px 0;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
    }
    #exportBtn { background: #2f6b0f; }
    #exportBtn:hover { background: #3a8313; }
    #clearBtn { background: #c00; }
    #clearBtn:hover { background: #d11; }
    #status { margin-top: 4px; font-size: 12px; color: #555; min-height: 16px; }
  </style>
</head>
<body>
  <h1>验证码失败样本</h1>
  <div id="count">加载中…</div>
  <button id="exportBtn">导出 ZIP</button>
  <button id="clearBtn">清空</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
